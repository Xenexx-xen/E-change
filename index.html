<!DOCTYPE html>

        }

            background-color: white;

            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 5px;
        }
        .header-subtitle {
            margin-top: 10px;
            font-size: 0.9em;
        }
        .container {
            padding: 20px;

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 8px;

            margin-bottom: 15px;
        }
        .price {
            color: #28a745;
            font-weight: bold;
            font-size: 1.2em;

        .seal {

            color: white;
            border: none;

            border-radius: 5px;
            cursor: pointer;
            width: 100%;
