<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-change | Engineering Parts</title>
    <style>
        /* This section is the CSS! It styles the HTML below */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #0056b3;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        .product-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .price {
            color: #28a745;
            font-weight: bold;
            font-size: 1.2em;
        }
        .seal {
            background: #ffc107;
            color: #000;
            font-size: 0.8em;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>E-change</h1>
        <p>Buy & Sell Engineering Project Parts</p>
    </header>

    <div class="container">
        <h2>Latest Listings</h2>
        
        <!-- This is a mock product card so we can see what a listing looks like -->
        <div class="product-card">
            <h3>Arduino Uno R3 <span class="seal">✓ Tested & Approved</span></h3>
            <p>Used for one mini-project. Works perfectly.</p>
            <p class="price">₹450</p>
            <button>Contact Seller</button>
        </div>
        
    </div>
</body>
</html>
