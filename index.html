<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-change | Engineering Parts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #0056b3;
            color: white;
            padding: 15px;
        }
        /* New CSS for our navigation bar */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-bar h1 {
            margin: 0;
            font-size: 1.5em;
        }
        .nav-btn {
            background-color: white;
            color: #0056b3;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 5px;
        }
        .header-subtitle {
            margin-top: 10px;
            font-size: 0.9em;
        }
        .container {
            padding: 20px;
        }
        .product-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .price {
            color: #28a745;
            font-weight: bold;
            font-size: 1.2em;
        }
        .seal {
            background: #ffc107;
            color: #000;
            font-size: 0.8em;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .buy-btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-bar">
            <h1>E-change</h1>
            <div>
                <button id="loginBtn" class="nav-btn">Log In</button>
                <button id="sellBtn" class="nav-btn">Sell Item</button>
            </div>
        </div>
        <p class="header-subtitle">Buy & Sell Engineering Project Parts</p>
    </header>

    <div class="container">
        <h2>Latest Listings</h2>
        
        <div class="product-card">
            <h3>Arduino Uno R3 <span class="seal">✓ Tested & Approved</span></h3>
            <p>Used for one mini-project. Works perfectly.</p>
            <p class="price">₹450</p>
            <button id="contactBtn" class="buy-btn">Contact Seller</button>
        </div>
    </div>
         <script type="module">
        // 1. Firebase Tools
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // ==========================================
        // 2. Keys:
        const firebaseConfig = {
    apiKey: "AIzaSyD4-EFT5udWC2ktigUZRhwaFsV7HImIN_4",
    authDomain: "e-change-9ad63.firebaseapp.com",
    projectId: "e-change-9ad63",
    storageBucket: "e-change-9ad63.firebasestorage.app",
    messagingSenderId: "1038203826555",
    appId: "1:1038203826555:web:2386ca7fddcbebd76acdde"
  };
        // ==========================================
        
        // 3. Start Services
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 4. Buttons
        document.getElementById('loginBtn').addEventListener('click', function() {
            const email = prompt("Let's create an account! Enter a test email:");
            const password = prompt("Enter a test password (at least 6 characters):");
            if(email && password) {
                createUserWithEmailAndPassword(auth, email, password)
                .then(() => alert("Success! Account created."))
                .catch((error) => alert("Error: " + error.message));
            }
        });

        document.getElementById('sellBtn').addEventListener('click', async function() {
            try {
                await addDoc(collection(db, "listings"), {
                    item: "Arduino Sensor",
                    price: 450,
                    status: "Tested & Approved"
                });
                alert("Success! Item added to database.");
            } catch (error) {
                alert("Error: " + error.message);
            }
        });

        document.getElementById('contactBtn').addEventListener('click', function() {
            alert('Step 3: Checkout coming soon.');
        });
    </script>
</body>
</html>
